<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Padaria do Sr. José</title>
</head>
<body>
    
    <header>
        <a href="index.html">
                <img 
                src="./image/logo.jpg" 
                alt="Logo da empresa" 
                width="50" 
                height="50"/>
            </a>
        <h1>Padaria do Sr. José</h1>   
        <nav>
            <ul>
                <li> <a href="index.html">Início</a> </li>
                <li> <a href="index.html#sobre">Sobre</a> </li>
                <li> <a href="index.html#produto">Produto</a> </li>
                <li><a href="index.html#diferenciais">Diferenciais</a></li>
                  <li> <a href="pedidos.html">Fazer Pedido</a> </li>
                  <li> <a href="feedback.html">Feedback</a> </li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Fale Conosco</h2>
        <p>Tem alguma dúvida ou sugestão? Envie uma mensagem!</p>

        <form>
            <fieldset>
                <legend>Seus dados</legend>
                <label for="nome">Nome:</label>
                <input type="text" id="nome"  name="nome" placeholder="Digite seu nome" />
                
                <br/>
                <br/>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail"/>

                <br/>
                <br/>

                <label for="telefone">Telefone:</label>
                <input 
                type="tel" 
                id="telefone" 
                name="telefone" 
                placeholder="Digite seu telefone"
                pattern="\([0-9]{2}\)[0-9]{5}-[0-9]{4}"
                />
            </fieldset>

            <fieldset>
                <legend>Sua mensagem</legend>
                <label for="assunto">Assunto:</label>

                <select id="assunto" name="assunto" required>
                    <option value="">--Selecione--</option>
                    <option value="duvida">Dúvida</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="reclamacao">Reclamação</option>
                    <option value="elogio">Elogio</option>
                </select>

                <br/>
                <br/>

                <label for="mensagem"> Mensagem:</label>
                <textarea id="mensagem" name="mensagem"></textarea>
            </fieldset>

            <button type="submit">Enviar mensagem</button>
        </form>
    </main>

    <footer>
            <p>&copy; 2026 Padaria do Sr. José. Todos os direitos reservados. </p>
    </footer>

</body>
</html>
